<h2>关于这个 App</h2>
<p>DayBell 用 iOS 的系统闹钟服务（AlarmKit）来响铃，因此可以在静音、专注模式和锁屏状态下响铃。它<strong>不能</strong>在手机关机或没电时响铃 —— 任何 App 都不能。这一点在 App 内、在使用条款里都写得很清楚。</p>
